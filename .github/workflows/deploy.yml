name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Prune old build directory
        run: rm -rf build || true

      - name: Build
        run: yarn build

      - name: Install ImageMagick and pngcrush
        # These tools are often pre-installed, but this ensures they are available
        run: sudo apt-get update && sudo apt-get install -y imagemagick pngcrush

      - name: Optimize PNGs and Strip Metadata
        run: |
          # Strips all metadata/optimizations using ImageMagick 'mogrify -strip'
          find build/client -name "*.png" -exec mogrify -strip -quality 80 {} \; || true
          # Runs pngcrush for final optimization
          find build/client -name "*.png" -exec pngcrush -ow -c 0 -rem all {} \; || true

      - name: Set correct permissions
        run: chmod -R a+rX build/client

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: build/client/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
