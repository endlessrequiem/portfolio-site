name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:


permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Prune old build directory
        run: rm -rf build || true

      - name: Build
        run: yarn build

      - name: Clean up symlinks
        run: find build -type l -delete || true

      - name: Set correct permissions
        run: chmod -R a+rX build

      - name: Copy index.html to client build
        run: |
          echo '<!DOCTYPE html><html><head><meta charset="utf-8" /><title>Portfolio Site</title><base href="/portfolio-site/" /></head><body><div id="root"></div></body></html>' > build/client/index.html   

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: build/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
